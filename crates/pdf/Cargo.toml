[package]
name = "cm-pdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cm-domain.workspace = true
cm-core.workspace = true
serde.workspace = true
sha2 = { version = "=0.10.9", optional = true }

[features]
default = []
bindings-check = ["dep:pdfium-render"]
runtime = ["bindings-check", "dep:sha2"]

[dependencies.pdfium-render]
workspace = true
optional = true

[dev-dependencies]
serde_json.workspace = true

[[example]]
name = "pdfium_poc"
required-features = ["runtime"]

[[test]]
name = "runtime"
required-features = ["runtime"]

[[example]]
name = "inherited_boxes_regression"
required-features = ["runtime"]
