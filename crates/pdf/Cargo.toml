[package]
name = "cm-pdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The workspace forbids `unsafe_code`. cm-pdf alone denies it instead so that the single
# audited FFI module `src/appearance.rs` (#20: FPDFAnnot_SetAP, which pdfium-render 0.9.5 only
# exposes as an unsafe binding) can opt in; every other module still fails to compile with
# `unsafe`. See docs/ADR/pdf-export.md.
[lints.rust]
unsafe_code = "deny"

[dependencies]
cm-domain.workspace = true
cm-core.workspace = true
serde.workspace = true
roxmltree = { version = "=0.21.2", optional = true }
sha2 = { version = "=0.10.9", optional = true }

[features]
default = []
bindings-check = ["dep:pdfium-render"]
runtime = ["bindings-check", "dep:sha2", "dep:roxmltree"]

[dependencies.pdfium-render]
workspace = true
optional = true

[dev-dependencies]
serde_json.workspace = true

[[example]]
name = "pdfium_poc"
required-features = ["runtime"]

[[test]]
name = "runtime"
required-features = ["runtime"]

[[example]]
name = "inherited_boxes_regression"
required-features = ["runtime"]

[[test]]
name = "metadata_runtime"
required-features = ["runtime"]

[[test]]
name = "extract_runtime"
required-features = ["runtime"]

[[test]]
name = "export_runtime"
required-features = ["runtime"]
