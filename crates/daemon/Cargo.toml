[package]
name = "cm-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cm-core.workspace = true
cm-protocol.workspace = true
cm-storage.workspace = true
cm-search.workspace = true
cm-pdf.workspace = true
cm-metadata.workspace = true

[features]
default = []
desktop-bootstrap = ["dep:cm-desktop", "cm-desktop/native-gpui"]

[target.'cfg(target_os = "macos")'.dependencies]
cm-desktop = { path = "../desktop", optional = true }

[[bin]]
name = "citation-manager"
path = "src/bin/citation-manager.rs"
required-features = ["desktop-bootstrap"]

[dev-dependencies]
tempfile.workspace = true
sha2.workspace = true
serde_json.workspace = true

# Composition-only DOI -> common import -> SQLite tests; no daemon implementation.
[[test]]
name = "doi_import"
path = "../../tests/integration/doi_import.rs"
