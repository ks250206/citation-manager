[package]
name = "cm-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cm-core.workspace = true
cm-protocol.workspace = true
cm-storage.workspace = true
cm-search.workspace = true
cm-pdf.workspace = true
cm-metadata.workspace = true
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[features]
default = []
desktop-bootstrap = ["dep:cm-desktop", "cm-desktop/native-gpui"]
layout-smoke = ["desktop-bootstrap", "cm-pdf/runtime", "dep:serde_json", "dep:sha2"]

[target.'cfg(target_os = "macos")'.dependencies]
cm-desktop = { path = "../desktop", optional = true }

[[bin]]
name = "citation-manager"
path = "src/bin/citation-manager.rs"
required-features = ["desktop-bootstrap"]

[dev-dependencies]
tempfile.workspace = true
