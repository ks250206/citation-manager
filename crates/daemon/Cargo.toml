[package]
name = "cm-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cm-core.workspace = true
cm-protocol.workspace = true
cm-storage.workspace = true
cm-search.workspace = true
cm-pdf.workspace = true
cm-metadata.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
rustix = { workspace = true, features = ["fs", "net"] }
uuid = { workspace = true, features = ["v7"] }

[features]
default = []
desktop-bootstrap = ["dep:cm-desktop", "cm-desktop/native-gpui", "pdf-metadata"]
pdf-metadata = ["cm-pdf/runtime"]

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
cm-desktop = { path = "../desktop", optional = true }

# On-demand per-library daemon (#25): the only writer, serving authenticated local IPC.
[[bin]]
name = "papersd"
path = "src/bin/papersd.rs"

[[bin]]
name = "citation-manager"
path = "src/bin/citation-manager.rs"
required-features = ["desktop-bootstrap"]

[dev-dependencies]
tempfile.workspace = true
sha2.workspace = true
serde_json.workspace = true

# Composition-only DOI -> common import -> SQLite tests; no daemon implementation.
[[test]]
name = "doi_import"
path = "../../tests/integration/doi_import.rs"

# #25 daemon: GUI-less IPC, auth/grants, lifecycle with the real papersd binary, jobs.
[[test]]
name = "daemon_ipc"
path = "../../tests/integration/daemon/ipc.rs"

[[test]]
name = "daemon_auth"
path = "../../tests/integration/daemon/auth.rs"

[[test]]
name = "daemon_lifecycle"
path = "../../tests/integration/daemon/lifecycle.rs"

[[test]]
name = "daemon_jobs"
path = "../../tests/integration/daemon/jobs.rs"

# Headless composition only; preserves metadata/storage dependency direction.
[[example]]
name = "backend_bench_import"
path = "../../scripts/benchmarks/import.rs"
test = true
