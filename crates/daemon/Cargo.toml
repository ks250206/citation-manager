[package]
name = "cm-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cm-core.workspace = true
cm-protocol.workspace = true
cm-storage.workspace = true
cm-search.workspace = true
cm-pdf.workspace = true
cm-metadata.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
rustix = { workspace = true, features = ["fs", "net"] }
uuid = { workspace = true, features = ["v7"] }
# #27 in-process REST listener (docs/ADR/rest-api.md): HTTP/1.1 only, no TLS, no CORS layer.
axum = { workspace = true, features = ["http1", "json", "query", "tokio", "matched-path"] }
tokio = { workspace = true, features = ["net", "time", "sync"] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio", "service"] }

[features]
default = []
desktop-bootstrap = ["dep:cm-desktop", "cm-desktop/native-gpui", "pdf-metadata"]
pdf-metadata = ["cm-pdf/runtime"]
# Opt-in real-PDFium daemon test (needs CM_PDFIUM_LIBRARY); never enabled by other lanes.
pdfium-runtime-tests = ["pdf-metadata"]

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
cm-desktop = { path = "../desktop", optional = true }

# On-demand per-library daemon (#25): the only writer, serving authenticated local IPC.
[[bin]]
name = "papersd"
path = "src/bin/papersd.rs"

[[bin]]
name = "citation-manager"
path = "src/bin/citation-manager.rs"
required-features = ["desktop-bootstrap"]

[dev-dependencies]
tempfile.workspace = true
sha2.workspace = true
serde_json.workspace = true
# #22: loopback HTTP fixture server + loopback-only fetch policy, tests only.
cm-metadata = { workspace = true, features = ["loopback-test-server"] }

# Composition-only DOI -> common import -> SQLite tests; no daemon implementation.
[[test]]
name = "doi_import"
path = "../../tests/integration/doi_import.rs"

# #25 daemon: GUI-less IPC, auth/grants, lifecycle with the real papersd binary, jobs.
[[test]]
name = "daemon_ipc"
path = "../../tests/integration/daemon/ipc.rs"

[[test]]
name = "daemon_auth"
path = "../../tests/integration/daemon/auth.rs"

[[test]]
name = "daemon_lifecycle"
path = "../../tests/integration/daemon/lifecycle.rs"

[[test]]
name = "daemon_jobs"
path = "../../tests/integration/daemon/jobs.rs"

# #26 scoped tokens, revocation/scope changes on live sessions, elevation, export folders,
# settings across restart and the papersd CLI bootstrap (memory secret store).
[[test]]
name = "daemon_api"
path = "../../tests/integration/daemon/api_tokens.rs"

# #27 REST API on an ephemeral loopback port: every endpoint (normal/401/403/revoked/
# invalid JSON/Host/Origin/limits), OpenAPI conformance, REST-IPC parity, request log.
[[test]]
name = "daemon_rest"
path = "../../tests/integration/daemon/rest.rs"

# #18 extraction jobs, search IPC and authorization (deterministic extractor, no PDFium).
[[test]]
name = "daemon_fulltext"
path = "../../tests/integration/daemon/fulltext.rs"

# #18 PDF -> real pinned PDFium extraction -> search. Needs CM_PDFIUM_LIBRARY and the
# explicit `pdfium-runtime-tests` feature (not implied by desktop-bootstrap lanes).
[[test]]
name = "fulltext_runtime"
path = "../../tests/integration/daemon/fulltext_runtime.rs"
required-features = ["pdfium-runtime-tests"]

# #30 longitudinal recovery with the real papersd: SIGKILL mid-write, integrity/orphans,
# backup/restore, migration-history refusal and IPC-detected index damage -> rebuild job.
[[test]]
name = "daemon_recovery"
path = "../../tests/integration/daemon/recovery.rs"

# #30 hostile IPC input (seeded mutation of frames/Hello/requests) against the real papersd.
[[test]]
name = "daemon_hostile"
path = "../../tests/integration/daemon/hostile.rs"

# #22 browser/URL capture: native-host grant, common preview/commit, PDF fetch job.
[[test]]
name = "daemon_capture"
path = "../../tests/integration/daemon/capture.rs"

# Headless composition only; preserves metadata/storage dependency direction.
[[example]]
name = "backend_bench_import"
path = "../../scripts/benchmarks/import.rs"
test = true

# #30 representative workload over real papersd IPC (warm start, switches, searches, recall).
[[example]]
name = "bench_representative_ipc"
path = "../../scripts/benchmarks/representative_ipc.rs"
test = true

# #20 library annotations -> annotated PDF copy -> PDFium re-read, with the pinned runtime.
[[test]]
name = "pdf_export_runtime"
required-features = ["pdfium-runtime-tests"]
