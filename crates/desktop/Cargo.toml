[package]
name = "cm-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cm-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[features]
default = []
native-gpui = ["dep:gpui", "dep:gpui_platform", "dep:unicode-segmentation", "dep:image"]

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
gpui = { workspace = true, optional = true }
gpui_platform = { workspace = true, optional = true }
unicode-segmentation = { version = "=1.13.3", optional = true }
# Same version GPUI already links; only used to hand decoded PDF pages to RenderImage.
image = { version = "=0.25.10", default-features = false, optional = true }
